name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        run: bun run lint

      - name: Astro check
        id: check
        run: bun run check

      - name: Knip
        id: knip
        run: bun run knip

      - name: Unit tests
        id: unit
        run: bun run test

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Quality checks failed"
            echo ""
            echo "| Step | Command |"
            echo "| --- | --- |"
            echo "| Lint | \`bun run lint\` |"
            echo "| Check | \`bun run check\` |"
            echo "| Knip | \`bun run knip\` |"
            echo "| Unit tests | \`bun run test\` |"
            echo ""
            echo "Re-run locally after \`bun install --frozen-lockfile\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        id: build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Prefer repo Variables when set; otherwise Astro loads committed .env.production
          # (PUBLIC_* anon/publishable only — same class of key formerly in script.js).
          if [ -n "$PUBLIC_SUPABASE_URL" ] && [ -n "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            printf 'PUBLIC_SUPABASE_URL=%s\nPUBLIC_SUPABASE_ANON_KEY=%s\n' \
              "$PUBLIC_SUPABASE_URL" "$PUBLIC_SUPABASE_ANON_KEY" > .env.production
          fi
          bun run build

      - name: Assert dist/CNAME
        run: test -f dist/CNAME

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo ""
            echo "Run \`bun run build\` locally and confirm \`dist/CNAME\` exists."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (Playwright)
    needs: build
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke tests
        id: e2e
        run: bun run test:e2e

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Smoke tests failed"
            echo ""
            echo "Run \`bun run build && CI=true bun run test:e2e\` locally."
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep publishing from branch root working while Pages is still "Deploy from a branch".
  # After switching Settings → Pages → Source to "GitHub Actions", this job can be removed.
  publish-legacy-root:
    name: Publish legacy Pages root
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - quality
      - build
      - smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Sync dist into branch root
        run: |
          set -euo pipefail
          rm -rf _astro about church-apps fun-apps money images
          cp -f dist/CNAME ./CNAME
          cp -f dist/.nojekyll ./.nojekyll
          cp -f dist/favicon.svg ./favicon.svg
          cp -f dist/index.html ./index.html
          cp -a dist/_astro ./_astro
          cp -a dist/about ./about
          cp -a dist/church-apps ./church-apps
          cp -a dist/fun-apps ./fun-apps
          cp -a dist/money ./money
          cp -a dist/images ./images

      - name: Commit published site if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- CNAME .nojekyll favicon.svg index.html _astro about church-apps fun-apps money images
          if git diff --cached --quiet; then
            echo "No published-root changes."
            exit 0
          fi
          git commit -m "chore: sync Astro dist to root for legacy Pages"
          git push

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - quality
      - build
      - smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Pages Actions deploy failed (non-fatal while source is still branch deploy)"
            echo ""
            echo "To use Actions deploy as the primary publisher: Settings → Pages → Source → **GitHub Actions**."
          } >> "$GITHUB_STEP_SUMMARY"
