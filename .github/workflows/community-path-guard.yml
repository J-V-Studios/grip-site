name: Community path guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: community-path-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  path-guard:
    name: Path guard + auto-merge
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'community/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate community sandbox paths
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/community-path-guard.sh
          scripts/community-path-guard.sh \
            "${{ github.head_ref }}" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: gripc check (GripApps)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          branch="${{ github.head_ref }}"
          suffix="${branch#community/}"
          if [[ ! "$suffix" =~ ^([a-z0-9]([a-z0-9-]{1,22}[a-z0-9])?)-[0-9a-f]{8}$ ]]; then
            echo "Skipping gripc check (branch name does not match community handle pattern)"
            exit 0
          fi
          handle="${BASH_REMATCH[1]}"
          app_grip="public/community/${handle}/app.grip"
          if git cat-file -e "${{ github.event.pull_request.head.sha }}:${app_grip}" 2>/dev/null; then
            bun run gripc -- check "$app_grip"
          else
            echo "No app.grip at PR tip for ${handle}; skipping gripc check"
          fi

      - name: gripc build parity (app.grip.js)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          branch="${{ github.head_ref }}"
          suffix="${branch#community/}"
          if [[ ! "$suffix" =~ ^([a-z0-9]([a-z0-9-]{1,22}[a-z0-9])?)-[0-9a-f]{8}$ ]]; then
            echo "Skipping build parity (branch name does not match community handle pattern)"
            exit 0
          fi
          handle="${BASH_REMATCH[1]}"
          bash scripts/gripapps-build-parity.sh "public/community/${handle}"

      - name: Enable auto-merge (squash)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          gh pr merge "$pr" --squash --auto
          echo "Auto-merge enabled for PR #${pr} when required checks pass."
